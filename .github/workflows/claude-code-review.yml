# Claude Code の PR レビュー

name: Claude Code Review

permissions: {}

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  claude-review:
    permissions:
      contents: read
      issues: read
      pull-requests: write
    if: contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load shared agent rules
        run: |
          mkdir -p ../dotfiles/.config/agents
          curl -fsSL -o ../dotfiles/.config/agents/AGENTS.md \
            https://raw.githubusercontent.com/pych-ky/dotfiles/main/.config/agents/AGENTS.md
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            コード品質・推奨慣行・不具合・性能・セキュリティ・テスト範囲をレビュー。
            指摘は日本語で GitHub コメントにのみ投稿し、メッセージには返さない。
            - 全体: `gh pr comment`
            - 行別: `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`)
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
