# claude-review 付き PR を、ラベル追加・更新時にレビュー
name: Claude Code Review

permissions: {}

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
    if: contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR のコード品質・推奨慣行・不具合・性能・セキュリティ・テスト範囲をレビューし、日本語で指摘してください。

            全体の指摘は `gh pr comment`、行別の指摘は `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`) で投稿してください。
            レビュー結果は GitHub コメントだけに投稿し、メッセージでは返さないでください。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
