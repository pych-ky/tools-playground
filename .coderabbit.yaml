# CodeRabbit のレビュー設定

language: ja-JP
reviews:
  profile: chill
  request_changes_workflow: true
  auto_review:
    drafts: true
    base_branches:
      - .*
knowledge_base:
  issues:
    scope: local
  learnings:
    scope: local
  pull_requests:
    scope: local
code_generation:
  docstrings:
    language: ja-JP
